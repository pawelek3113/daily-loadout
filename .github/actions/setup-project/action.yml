name: "Setup project"
description: "Checkout, setup bun and node, install dependencies"
runs:
  using: "composite"
  steps:
    - uses: oven-sh/setup-bun@v2

    - uses: actions/setup-node@v6
      with:
        node-version: lts/*

    - name: Install dependencies
      run: bun install ci
      shell: bash
